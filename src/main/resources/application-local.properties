# API and database on the development machine.
server.address=127.0.0.1
spring.config.import=optional:${LOCAL_ENV_LOCATION:file:./.env}[.properties]
spring.datasource.url=${LOCAL_DB_URL:jdbc:mysql://localhost:3306/controlprendario}
spring.datasource.username=${LOCAL_DB_USERNAME:root}
# Local instances can connect to an existing database with legacy key types.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# A generated key is valid for this process. Set LOCAL_JWT_SECRET to keep local sessions across restarts.
jwt.secret=${LOCAL_JWT_SECRET:${random.uuid}${random.uuid}}
