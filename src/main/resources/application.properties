spring.application.name=prendario
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.control.prendario=${LOG_LEVEL_APP:INFO}

# Configuración de la base de datos (TiDB Cloud / MySQL 8)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/controlprendario?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
# update conserva los datos al reiniciar y agrega columnas/tablas nuevas
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# La validación de datos se hace en la API (@Valid); no se repite al persistir
# para no bloquear registros históricos incompletos al archivarlos o actualizarlos
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Configuración de caracteres
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# Configuración JWT (JWT_SECRET de al menos 32 caracteres; vigencia por defecto 8 horas)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}

# Usuarios: ADMIN = gerente, OPERATOR = empleado
app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password=${ADMIN_PASSWORD:}
app.security.operator.username=${OPERATOR_USERNAME:}
app.security.operator.password=${OPERATOR_PASSWORD:}
